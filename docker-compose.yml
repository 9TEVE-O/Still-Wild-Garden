
services:
  api:
    build: .
    command: uvicorn stillwild.api:app --host 0.0.0.0 --port 8000
    environment:
      STILLWILD_DB_PATH: /data/stillwild.db
      STILLWILD_WILD_SIM: ${STILLWILD_WILD_SIM:-false}
      STILLWILD_WILD_SEED: ${STILLWILD_WILD_SEED:-7}
      STILLWILD_WILD_DAYS_PER_TICK: ${STILLWILD_WILD_DAYS_PER_TICK:-1}
      STILLWILD_TICK_SECONDS: ${STILLWILD_TICK_SECONDS:-300}
      STILLWILD_CATCH_UP_LIMIT: ${STILLWILD_CATCH_UP_LIMIT:-6}
      STILLWILD_TASK_TOKEN: ${STILLWILD_TASK_TOKEN:-}
      STILLWILD_OPERATOR_TOKEN: ${STILLWILD_OPERATOR_TOKEN:-}
      STILLWILD_SENSOR_TOKEN: ${STILLWILD_SENSOR_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - stillwild-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: python -m stillwild.worker
    environment:
      STILLWILD_DB_PATH: /data/stillwild.db
      STILLWILD_TICK_SECONDS: ${STILLWILD_TICK_SECONDS:-300}
      STILLWILD_CATCH_UP_LIMIT: ${STILLWILD_CATCH_UP_LIMIT:-6}
      STILLWILD_WORKER_ID: worker-1
      STILLWILD_WILD_SIM: ${STILLWILD_WILD_SIM:-false}
      STILLWILD_WILD_SEED: ${STILLWILD_WILD_SEED:-7}
      STILLWILD_WILD_DAYS_PER_TICK: ${STILLWILD_WILD_DAYS_PER_TICK:-1}
    volumes:
      - stillwild-data:/data
    restart: unless-stopped

volumes:
  stillwild-data:
