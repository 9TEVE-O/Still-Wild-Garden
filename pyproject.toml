
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillwild-garden"
version = "0.1.0"
description = "A persistent agentic ecological garden system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
stillwild-api = "stillwild.api:run"
stillwild-worker = "stillwild.worker:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stillwild = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
