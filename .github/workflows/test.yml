
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts/verify-background.py
      - run: pytest -q
      - run: python scripts/verify-background.py --output background-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-background-smoke
          path: background-smoke.json
          if-no-files-found: error
