name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts/verify-background.py
      - run: pytest -q
      - run: python scripts/verify-background.py --output background-smoke.json
      - run: python -O scripts/verify-background.py --output background-smoke-optimized.json
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-background-smoke
          path: |
            background-smoke.json
            background-smoke-optimized.json
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            verifier: verify-persistence.cjs
          - app: background-proof
            verifier: verify-background.cjs
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - if: matrix.app == 'web'
        run: node --experimental-strip-types scripts/verify-internal-auth.mjs
      - run: node scripts/${{ matrix.verifier }}
      - if: matrix.app == 'web'
        run: node scripts/verify-camera.cjs
      # The renderer checks need a Node canvas. It is installed outside the app's lockfile so the
      # managed Site build and its dependencies stay unchanged.
      - if: matrix.app == 'web'
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/canvas" @napi-rs/canvas@1.0.11
      - if: matrix.app == 'web'
        run: node scripts/verify-growth.cjs --require-canvas
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/canvas/node_modules
      - if: matrix.app == 'background-proof'
        run: node scripts/verify-provenance.cjs
      - run: pnpm build
      # Test the migrated SQLite schema through Cloudflare Wrangler's D1 local emulator.
      # The state directory is ephemeral and separate from either managed Site.
      - if: matrix.app == 'background-proof'
        name: Verify isolated Wrangler D1 view-closure ordering
        shell: bash
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          for migration in \
            drizzle/0000_melodic_lucky_pierre.sql \
            drizzle/0001_scheduler_provenance.sql \
            drizzle/0002_view_closure_gate.sql; do
            pnpm exec wrangler d1 execute site-creator-d1 \
              --local --config dist/server/wrangler.json --persist-to "$state" \
              --file "$migration"
          done
          pnpm exec wrangler d1 execute site-creator-d1 \
            --local --config dist/server/wrangler.json --persist-to "$state" \
            --file scripts/fixtures/view-closure-wrangler-local.sql
